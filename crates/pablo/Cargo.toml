[package]
name = "pablo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
futures.workspace = true
async-channel.workspace = true
async-io.workspace = true
pablo-core = { path = "../pablo-core" }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tokio = { workspace = true, features = ["signal", "io-util", "net", "sync"] }
uuid.workspace = true
dotenvy.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest.workspace = true
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-rustls", "reqwest-client", "gzip-http", "experimental-http-retry"] }
opentelemetry-http = { version = "=0.32.0", default-features = false }
async-trait = "=0.1.92"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["trace", "gen-tonic-messages"] }
prost = { version = "=0.14.4", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
