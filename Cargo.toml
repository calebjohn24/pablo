[workspace]
members = ["crates/pablo-core", "crates/pablo"]
exclude = ["vendor/opentelemetry_sdk-0.32.1", "vendor/opentelemetry-otlp-0.32.0"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
rmcp = { version = "=3.3.0", default-features = false, features = ["client"] }
agent-client-protocol = { version = "=2.1.0", default-features = false }
futures = "=0.3.34"
async-channel = "=2.5.0"
async-io = "=2.6.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt", "io"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
dotenvy = "=0.15.7"
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["non-fips"] }
jsonschema = { version = "=0.53.0", default-features = false }
rustix = { version = "=1.1.4", features = ["process", "fs"] }
uuid = { version = "=1.26.0", features = ["v4"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
opentelemetry_sdk = { path = "vendor/opentelemetry_sdk-0.32.1" }
opentelemetry-otlp = { path = "vendor/opentelemetry-otlp-0.32.0" }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
