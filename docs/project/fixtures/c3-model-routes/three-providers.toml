schema_version=1
[credentials.router]
consumer="provider.openrouter"
sources=[{kind="environment",name="ROUTE_ROUTER_KEY"}]
[credentials.vercel]
consumer="provider.vercel"
sources=[{kind="environment",name="ROUTE_VERCEL_KEY"}]
[credentials.responses]
consumer="provider.open_responses"
sources=[{kind="environment",name="ROUTE_RESPONSES_KEY"}]
[options]
model_route="main"
[options.models.primary]
provider="openrouter"
id="z-ai/glm-5.3-flash"
credential="router"
[options.models.secondary]
provider="vercel"
id="zai/glm-5.3-flash"
credential="vercel"
[options.models.third]
provider="open_responses"
id="fixture-text-tools-v1"
endpoint="https://responses.example.test/v1/responses"
capability_profile="open-responses-text-tools-v1"
credential="responses"
[options.routes.main]
entries=[{model="primary"},{model="secondary"},{model="third"}]
[options.shell]
enabled=false
[options.limits]
max_model_calls=2
max_tool_calls=1
