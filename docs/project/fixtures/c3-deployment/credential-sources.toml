schema_version = 1

[options.run]
workspace = { base = "binding", name = "workspace", path = "." }

[credentials.gateway]
consumer = "provider.vercel"
sources = [
  { kind = "environment", name = "SYNTHETIC_GATEWAY_KEY" },
  { kind = "file", path = { base = "binding", name = "secrets", path = "gateway.token" }, encoding = "utf8" },
  { kind = "host", name = "gateway-lease" },
]

[credentials.collector]
consumer = "otel.headers"
sources = [{ kind = "file", path = { base = "binding", name = "secrets", path = "collector.env" }, encoding = "dotenv", key = "SYNTHETIC_OTLP_HEADERS" }]

[options.otel]
exporter = "otlp"
headers = "collector"
