# C3.9 runnable configuration shape. Replace example endpoint/model before live use.
schema_version = 1

[credentials.responses]
consumer = "provider.open_responses"
sources = [{ kind = "environment", name = "EXAMPLE_RESPONSES_TOKEN" }]

[options.model]
provider = "open_responses"
id = "operator-selected-model"
endpoint = "https://responses.example.test/v1/responses"
capability_profile = "open-responses-text-tools-v1"
credential = "responses"
auth_header = "Authorization"
auth_scheme = "bearer"

[options.shell]
enabled = false
